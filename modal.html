<div id="shortcutOverlay"></div>
<div id="shortcutModal">
    <div id="modalHeader">
        <img id="modalIcon" src="" alt="SecOps Icon">
        <h2>SecOps Command Palette & Shortcuts</h2>
        <button id="closeModalButton" aria-label="Close shortcuts modal">&times;</button>
    </div>
    <hr>
    <div id="searchContainer">
        <input type="text" id="shortcutSearchInput" placeholder="🔍 Type a command, page ('/'), tab ('@'), or action ('>')..." autocomplete="off" spellcheck="false">
        <div id="searchKeyHints">
            <span class="hint-item"><kbd>↑</kbd><kbd>↓</kbd> / <kbd>^N</kbd><kbd>^P</kbd> navigate</span>
            <span class="hint-item"><kbd>↵</kbd> open</span>
            <span class="hint-item"><kbd>⇧↵</kbd> new tab</span>
            <span class="hint-item"><kbd>@</kbd> tabs</span>
            <span class="hint-item"><kbd>/</kbd> pages</span>
            <span class="hint-item"><kbd>&gt;</kbd> actions</span>
            <span class="hint-item"><kbd>esc</kbd> close</span>
        </div>
    </div>

    <div id="shortcutList"></div>

    <div id="modalFooter">
        <div id="footerStatusPills">
            <button id="turboStatusPill" class="status-pill status-pill--on" title="Click or press Alt+Shift+P to toggle Turbo Mode">
                <span class="pill-dot"></span> 🚀 Turbo: <b id="turboPillText">ON</b>
                <span class="pill-hotkey">Alt+Shift+P</span>
            </button>
            <button id="monacoStatusPill" class="status-pill status-pill--off" title="Click or press Alt+Shift+T to toggle Monaco Typeahead">
                <span class="pill-dot"></span> ⚡ Monaco Typeahead: <b id="monacoPillText">OFF</b>
                <span class="pill-hotkey">Alt+Shift+T</span>
            </button>
            <span id="modalVersion" class="version-pill"></span>
        </div>
        <p class="footer-note"><b>SecOps Command Palette</b> • Use keyboard shortcuts for instant SPA navigation and tab switching.</p>
    </div>
</div>
